name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: echo "lint step is stubbed until workspace scripts are scaffolded in Phase 2."

      - name: Type check
        run: echo "typecheck step is stubbed until workspace scripts are scaffolded in Phase 2."

      - name: Build web app (placeholder until apps/web exists)
        run: echo "apps/web not scaffolded yet — real build step lands in Phase 2."

      - name: Check mobile app (placeholder until apps/mobile exists)
        run: echo "apps/mobile not scaffolded yet — real export step lands in Phase 2."